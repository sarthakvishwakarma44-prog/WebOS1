<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="desktop">

        <div class="desktop-icon">
            <div class="icon">📁</div>
            <span>Files</span>
        </div>

        <div class="desktop-icon">
            <div class="icon">📝</div>
            <span>Notes</span>
        </div>

        <div class="desktop-icon">
            <div class="icon">🧮</div>
            <span>Calculator</span>
        </div>
        <div id="filesWindow" class="window">

    <div class="windowHeader">
        <span>📁 Files</span>

        <div class="windowControls">
            <button id="minimizeFiles">−</button>
            <button id="maximizeFiles">□</button>
            <button id="closeFiles">×</button>
        </div>
    </div>

    <div class="windowContent">

        <h2>File Manager</h2>

        <div class="fileArea">
            📄 Documents
            <br><br>
            🖼️ Pictures
            <br><br>
            🎵 Music
            <br><br>
            🎮 Games
        </div>

    </div>

</div>
<div id="notesWindow" class="window">

    <div class="windowHeader">
        <span>📝 Notes</span>

        <div class="windowControls">
            <button id="minimizeNotes">−</button>
            <button id="maximizeNotes">□</button>
            <button id="closeNotes">×</button>
        </div>
    </div>

    <div class="notesContent">

        <div class="notesToolbar">
            <button id="saveNote">💾 Save</button>
            <button id="clearNote">🗑️ Clear</button>
        </div>

        <textarea
            id="notesEditor"
            placeholder="Start writing..."
        ></textarea>

        <div id="saveStatus">
            Ready
        </div>

    </div>

</div> 
<div id="calculatorWindow" class="window">

    <div class="windowHeader">
        <span>🧮 Calculator</span>

        <div class="windowControls">
            <button id="minimizeCalculator">−</button>
            <button id="maximizeCalculator">□</button>
            <button id="closeCalculator">×</button>
        </div>
    </div>

    <div class="calculatorContent">

        <input
            id="calculatorDisplay"
            type="text"
            value="0"
            readonly
        >

        <div class="calculatorButtons">

            <button data-value="C">C</button>
            <button data-value="(">(</button>
            <button data-value=")">)</button>
            <button data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button data-value="+">+</button>

            <button data-value="0" class="zero">0</button>
            <button data-value=".">.</button>
            <button data-value="=" class="equals">=</button>

        </div>

    </div>

</div>        
    </main>

    <footer id="taskbar">

        <button id="startButton">⊞</button>
        <div id="startMenu">

    <div id="searchBox">
        🔎 Search apps...
    </div>

    <div class="startApps">

        <button class="appButton" id="filesApp">
    📁
    <span>Files</span>
</button>

        <button class="appButton" id="notesApp">
    📝
    <span>Notes</span>
</button>
        <button class="appButton" id="calculatorApp">
    🧮
    <span>Calculator</span>
</button>

        <button class="appButton">
            ⚙️
            <span>Settings</span>
        </button>

        <button class="appButton">
            🎮
            <span>Games</span>
        </button>

        <button class="appButton">
            📊
            <span>Task Manager</span>
        </button>

    </div>

    <div id="startBottom">
        <span>👤 WebOS User</span>
        <button>⏻</button>
    </div>

</div>
        <div id="taskbarApps"></div>

        <div id="systemTray">
            <span id="battery">🔋 --%</span>
            <span id="clock">00:00</span>
        </div>

    </footer>

    <script src="script.js"></script>

</body>
</html>
