<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="desktop">

        <div class="desktop-icon">
            <div class="icon">📁</div>
            <span>Files</span>
        </div>

        <div class="desktop-icon">
            <div class="icon">📝</div>
            <span>Notes</span>
        </div>

        <div class="desktop-icon">
            <div class="icon">🧮</div>
            <span>Calculator</span>
        </div>

    </main>

    <footer id="taskbar">

        <button id="startButton">⊞</button>

        <div id="taskbarApps">
            <!-- Apps will appear here later -->
        </div>

        <div id="systemTray">
            <span id="battery">🔋 --%</span>
            <span id="clock">00:00</span>
        </div>

    </footer>

    <script src="script.js"></script>

</body>
</html>
