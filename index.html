<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="desktop">

        <div class="desktop-icon">
            <div class="icon">📁</div>
            <span>Files</span>
        </div>

        <div class="desktop-icon">
            <div class="icon">📝</div>
            <span>Notes</span>
        </div>

        <div class="desktop-icon">
            <div class="icon">🧮</div>
            <span>Calculator</span>
        </div>
        <div id="filesWindow" class="window">

    <div class="windowHeader">
        <span>📁 Files</span>

        <div class="windowControls">
            <button id="minimizeFiles">−</button>
            <button id="maximizeFiles">□</button>
            <button id="closeFiles">×</button>
        </div>
    </div>

    <div class="windowContent">

        <h2>File Manager</h2>

        <div class="fileArea">
            📄 Documents
            <br><br>
            🖼️ Pictures
            <br><br>
            🎵 Music
            <br><br>
            🎮 Games
        </div>

    </div>

</div>
    </main>

    <footer id="taskbar">

        <button id="startButton">⊞</button>
        <div id="startMenu">

    <div id="searchBox">
        🔎 Search apps...
    </div>

    <div class="startApps">

        <button class="appButton" id="filesApp">
    📁
    <span>Files</span>
</button>

        <button class="appButton" id="notesApp">
    📝
    <span>Notes</span>
</button>
        <button class="appButton">
            🧮
            <span>Calculator</span>
        </button>

        <button class="appButton">
            ⚙️
            <span>Settings</span>
        </button>

        <button class="appButton">
            🎮
            <span>Games</span>
        </button>

        <button class="appButton">
            📊
            <span>Task Manager</span>
        </button>

    </div>

    <div id="startBottom">
        <span>👤 WebOS User</span>
        <button>⏻</button>
    </div>

</div>
        <div id="taskbarApps"></div>

        <div id="systemTray">
            <span id="battery">🔋 --%</span>
            <span id="clock">00:00</span>
        </div>

    </footer>

    <script src="script.js"></script>

</body>
</html>
